name: GuitarChords
options:
  bundleIdPrefix: com.habbi95
  deploymentTarget:
    iOS: "17.0"
packages:
  WebShellKit:
    path: WebShellKit
targets:
  GuitarChords:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: web            # copied from the repo root by CI before `xcodegen generate`
        type: folder
        buildPhase: resources
    dependencies:
      - package: WebShellKit
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habbi95.guitarchords
        PRODUCT_NAME: GuitarChords
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chords
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
